[package]
name = "journal-rs"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Rust CLI for the Apple Journal Core Data store"
build = "build.rs"

[dependencies]
anyhow = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
libc = "0.2"
unicode-segmentation = "1"
fancy-regex = "0.16"
clap = { version = "4.5", features = ["derive", "env"] }
rmcp = { version = "3.4.0", features = ["transport-io"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-std"] }
